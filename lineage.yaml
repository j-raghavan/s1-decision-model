# Machine-readable lineage: every model and dataset used to build s1, with organisation, licence and role.
# Keep in sync with LINEAGE.md; enforced in CI by scripts/check_lineage.py (provenance allowlist + licence policy).
# use: train | teacher | eval-only. eval-only entries never feed training, labeling or a shipped artifact.
models:
  - name: Gemma 4 12B
    hub_id: google/gemma-4-12B-it
    role: candidate teacher, measured zero-shot; not used for the released model
    use: eval-only
    organisation: Google
    license: Apache-2.0
    status: verified
    source: ollama show --license gemma4:12b
  - name: Gemma 4 26B-A4B
    hub_id: google/gemma-4-26B-A4B-it
    role: base model of the released s1 weights, and the teacher whose soft targets the fine-tune was trained on
    use: train
    organisation: Google
    license: Apache-2.0
    status: verified
    source: ollama show --license gemma4:26b
  - name: Gemma 4 31B
    hub_id: google/gemma-4-31B-it
    role: candidate teacher, measured zero-shot; not used for the released model
    use: eval-only
    organisation: Google
    license: Apache-2.0
    status: verified
  - name: gpt-oss-120b
    hub_id: openai/gpt-oss-120b
    role: generator of the synthetic task families in the training data; a generated answer is kept only where Gemma 4 26B-A4B independently agrees
    use: teacher
    organisation: OpenAI
    license: Apache-2.0
    status: verified
  - name: ModernBERT-large
    hub_id: answerdotai/ModernBERT-large
    role: backbone of the earlier encoder (s1 v1-v3); not part of the released model
    use: train
    organisation: Answer.AI / LightOn
    license: Apache-2.0
    status: pending
  - name: Von 1.3
    hub_id: wfzyx/von
    role: baseline only; weights not reused
    use: eval-only
    organisation: wfzyx (independent)
    license: Apache-2.0
    status: verified
    source: training corpus can include soft labels distilled from Jev 1.13 (SargeDev/jev-distill-corpus-v3), whose backbone is unpublished
  - name: Laya 421M
    hub_id: convaiinnovations/laya
    role: baseline only; weights not reused
    use: eval-only
    organisation: ConvAI Innovations
    license: Apache-2.0
    status: verified
    source: RLCD training against an undisclosed teacher
  - name: Jev 1.13.0
    role: baseline only; published JevBench predictions, no API use
    use: eval-only
    organisation: TypeSafe AI; backbone unpublished
    license: proprietary
    status: verified
  - name: Inkling and Inkling small
    role: candidate teachers, measured zero-shot through OpenRouter (answers only, no log-probabilities); not used for the released model
    use: eval-only
    organisation: Thinking Machines Lab
    license: proprietary (hosted API)
    status: verified
datasets:
  - name: custom_v0 eval set
    use: eval-only
    organisation: generated by rules in this repo (eval/custom/generate.py); no model involved
    license: Apache-2.0
    status: verified
  - name: JevBench v0.1 cases
    hub_id: Leanmcp/jevbench
    use: eval-only
    organisation: Leanmcp (harness, MIT); rows from the sources below
    license: per source
    status: verified
  - name: MedMCQA
    hub_id: openlifescienceai/medmcqa
    use: eval-only
    organisation: Saama AI Research
    license: Apache-2.0
    status: verified
  - name: MedQA-USMLE 4-options

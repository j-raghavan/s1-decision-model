    use: train
    organisation: generated by openai/gpt-oss-120b from pipeline/generate_synthetic.py seeds; consensus-filtered against Gemma 4
    license: Apache-2.0
    status: verified
  - name: Super-NaturalInstructions (199 audited decision tasks)
    use: train
    organisation: AI2 collection, github.com/allenai/natural-instructions; 89 per-task sources reviewed against the provenance policy, exclusions listed in pipeline/sni_manifest.json
    license: Apache-2.0 collection; per-task instance licenses permissive only (no NC, no Unknown)

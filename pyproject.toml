[project]
name = "s1-model"
version = "0.0.1"
description = "Open, calibrated System One decision model: typed decisions with calibrated probabilities in one forward pass"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jayasimha Raghavan" }]
requires-python = ">=3.12,<3.13"
keywords = [
    "decision-model",
    "calibration",
    "classification",
    "llm",
    "gemma",
    "lora",
    "evaluation",
    "machine-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.optional-dependencies]
von = ["von-sdk>=1.3.7"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
data = ["datasets>=3.0", "pyarrow>=15"]
train = ["torch>=2.4", "transformers>=5.0", "pytest>=8", "peft>=0.15", "accelerate>=1.0"]

[project.urls]
Homepage = "https://j-raghavan.github.io/s1-decision-model"
Repository = "https://github.com/j-raghavan/s1-decision-model"
Model = "https://huggingface.co/j-raghavan/s1-gemma4-26b-decision"
Dataset = "https://huggingface.co/datasets/j-raghavan/s1-decision-data"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: loads real ModernBERT-large weights from the Hugging Face Hub (about 1.6 GB) and runs them on CPU",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# Sibling scripts in these directories import each other by bare module name (via sys.path), so they count as
# first-party for import sorting.
src = [".", "eval/jevbench", "pipeline", "scripts"]
extend-exclude = ["results", "site", "_site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines are mostly prompt strings and data literals; wrapping them is not worth the churn
    "E702",  # compact `a; b` statements are used deliberately in the Colab session scripts
    "E741",  # `l` is used for lines and logits in short comprehensions
    "B905",  # zip(strict=...) everywhere would be noise; lengths are checked where it matters
]

[tool.ruff.lint.isort]
known-first-party = ["s1", "api", "pipeline", "eval"]
